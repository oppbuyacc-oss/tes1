        body {

            background-color: #030303;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #050505; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #71717a; }

        .chrome-text {
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 40%, #ffffff 70%, #52525b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chrome-border {
            border: 1px solid transparent;
            background-image: linear-gradient(#09090b, #09090b), linear-gradient(135deg, #ffffff, #27272a, #ffffff, #18181b);
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }

        .chrome-card-hover {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .chrome-card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px -10px rgba(255, 255, 255, 0.15);
        }

        .moncler-glass {
            background: rgba(12, 12, 14, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .chrome-button {
            background: linear-gradient(135deg, #ffffff 0%, #e4e4e7 50%, #d4d4d8 100%);
            color: #000000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }
        .chrome-button:hover {
            background: linear-gradient(135deg, #ffffff 0%, #ffffff 100%);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.35);
        }

        .tiktok-button {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 30%, #ff0050 100%);
            color: #ffffff;
            transition: all 0.3s ease;
        }
        .tiktok-button:hover {
            opacity: 0.95;
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(255, 0, 80, 0.4);
        }
    </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-white selection:text-black">

                </a>

                    <i class="fa-solid fa-camera text-xs"></i>
                    <span class="hidden sm:inline">KI-Bildsuche</span>
                </button>
                <input type="file" id="aiImageInput" accept="image/*" class="hidden" onchange="handleAIImageScan(event)">

                <div class="relative w-full sm:w-64 md:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="Marke, Name oder Kategorie..."

            </div>
        </div>
    </header>

                </button>
                <button class="filter-cat px-4 py-2 bg-zinc-900/60 border border-zinc-800/80 hover:border-zinc-600 text-zinc-400 rounded-xl text-xs font-semibold uppercase tracking-wider whitespace-nowrap transition" data-category="jacken">

                </button>
                <button class="filter-cat px-4 py-2 bg-zinc-900/60 border border-zinc-800/80 hover:border-zinc-600 text-zinc-400 rounded-xl text-xs font-semibold uppercase tracking-wider whitespace-nowrap transition" data-category="oberteile">

                <button class="filter-cat px-4 py-2 bg-zinc-900/60 border border-zinc-800/80 hover:border-zinc-600 text-zinc-400 rounded-xl text-xs font-semibold uppercase tracking-wider whitespace-nowrap transition" data-category="hosen">

                <div>

                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>

                    </div>

                </div>
                <button type="submit" class="mt-2 chrome-button font-bold py-2.5 rounded-lg transition text-sm uppercase tracking-wider shadow-lg">
                    Produkt Speichern

            </form>

            { id: 103, name: "Ray-Ban Wayfarer Classic Sonnenbrille", brand: "Ray-Ban", category: "accessoires", image: "103.jpg", link: "https://c.onlyaff.app/dYtbr2" },
            { id: 104, name: "Acne Studios Stockholm 1996 Longsleeve Schwarz", brand: "Acne Studios", category: "oberteile", image: "104.jpg", link: "https://c.onlyaff.app/dYtcaL" },
            { id: 105, name: "Rick Owens Low Ramones Leather Sneaker", brand: "Rick Owens", category: "schuhe", image: "105.jpg", link: "https://c.onlyaff.app/dYtcmM" },
            { id: 106, name: "Moncler Maya / Montbeliard Daunenjacke Schwarz", brand: "Moncler", category: "jacken", image: "106.jpg", link: "https://c.onlyaff.app/dYtdoP" },
            { id: 107, name: "Corteiz Alcatraz Outdoor Shell Jacke Schwarz", brand: "Corteiz", category: "jacken", image: "107.jpg", link: "https://c.onlyaff.app/dYtqH0" },
            { id: 108, name: "Bellstaff Classic Waterproof Waxed Jacket", brand: "Bellstaff", category: "jacken", image: "108.jpg", link: "https://c.onlyaff.app/dYtGN2" }
        ];

        let products = initialProducts;
        let currentCategory = 'alle';
        let currentBrand = 'alle';
        let currentSort = 'default';
        let aiFilterQuery = '';

        const grid = document.getElementById('productGrid');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');

        // FontAwesome Icons für die Kategorie-Fallbacks
        const categoryIconMap = {
            jacken: "fa-shirt",
            oberteile: "fa-vest",
            hosen: "fa-socks",
            schuhe: "fa-shoe-prints",
            accessoires: "fa-hat-cowboy"
        };

        function updateCounts() {
            const categories = ['alle', 'jacken', 'oberteile', 'hosen', 'schuhe', 'accessoires'];
            categories.forEach(cat => {
                const count = cat === 'alle' ? products.length : products.filter(p => p.category === cat).length;
                const el = document.getElementById(`count-${cat}`);
                if (el) el.innerText = count;
            });
        }

        function populateBrandFilter() {
            const brands = ['alle', ...new Set(products.map(p => p.brand))].sort();
            const brandContainer = document.getElementById('brandFilters');
            brandContainer.innerHTML = `<span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest px-2">Marke:</span>`;

            brands.forEach(b => {
                const btn = document.createElement('button');
                const isActive = b === currentBrand;
                btn.className = `filter-brand px-3 py-1 rounded-lg text-xs font-semibold uppercase tracking-wider whitespace-nowrap transition ${isActive ? 'chrome-button' : 'bg-zinc-900/60 text-zinc-400 hover:bg-zinc-800'}`;
                btn.innerText = b === 'alle' ? 'Alle Marken' : b;
                btn.onclick = () => {
                    currentBrand = (currentBrand === b && b !== 'alle') ? 'alle' : b;
                    populateBrandFilter();
                    filterAndRender();
                };
                brandContainer.appendChild(btn);
            });
        }

        function renderProducts(items) {
            grid.innerHTML = '';
            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-center">
                        <i class="fa-solid fa-sparkles text-5xl text-zinc-800 mb-4"></i>
                        <p class="text-zinc-500 font-medium text-xs uppercase tracking-widest">Keine Produkte gefunden</p>
                    </div>
                `;
                return;
            }

            items.forEach(product => {
                const card = document.createElement('div');
                card.className = "bg-zinc-950 border border-zinc-800/80 rounded-2xl overflow-hidden flex flex-col justify-between chrome-card-hover group relative";

                const categoryIcon = categoryIconMap[product.category] || "fa-shirt";

                card.innerHTML = `
                    <div>
                        <div class="relative h-64 bg-zinc-900/60 overflow-hidden border-b border-zinc-900 flex items-center justify-center">
                            <img src="${product.image}" alt="" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" 
                                onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">
                            
                            <!-- Edler Chrome / Moncler Style Fallback Badge -->
                            <div class="hidden w-full h-full bg-gradient-to-br from-zinc-900 via-zinc-950 to-black flex flex-col items-center justify-center p-4 text-center border-b border-zinc-800">
                                <div class="w-16 h-16 rounded-2xl bg-zinc-900/90 border border-zinc-700/80 flex items-center justify-center mb-3 shadow-xl group-hover:border-zinc-400 transition">
                                    <i class="fa-solid ${categoryIcon} text-2xl text-zinc-300"></i>
                                </div>
                                <span class="text-xs font-black text-white uppercase tracking-widest">${product.brand}</span>
                                <span class="text-[10px] font-semibold text-zinc-500 uppercase tracking-widest mt-1">${product.category}</span>
                            </div>

                            <span class="absolute top-3 left-3 z-10 bg-black/90 backdrop-blur border border-zinc-700/80 text-[10px] font-bold px-2.5 py-1 rounded-lg text-white uppercase tracking-wider shadow-lg">
                                ${product.brand}
                            </span>
                        </div>
                        <div class="p-4">
                            <h3 class="font-semibold text-xs text-zinc-200 leading-relaxed line-clamp-2">
                                <span class="font-bold text-white uppercase tracking-wider block mb-0.5">${product.brand}</span>
                                ${product.name}
                            </h3>
                        </div>
                    </div>
                    <div class="p-4 pt-0 flex flex-col gap-2">
                        <a href="${product.link}" target="_blank" class="w-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-center text-xs font-bold py-2 rounded-xl transition text-zinc-200 flex items-center justify-center gap-1.5 uppercase tracking-wider">
                            Öffnen <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                        <button onclick="copyLink('${product.link}', this)" class="chrome-button w-full text-xs font-black py-2.5 rounded-xl transition flex flex-col items-center justify-center uppercase tracking-wider leading-tight shadow-md">
                            <div class="flex items-center gap-1.5 text-xs font-extrabold">
                                <i class="fa-regular fa-copy"></i> LINK KOPIEREN
                            </div>
                            <span class="text-[10px] font-black tracking-widest text-zinc-900 mt-0.5">USE CODE: LINKKINGS14 (14% OFF)</span>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function copyLink(link, btn) {
            const formattedText = `${link} use code Linkkings14 for 14% off`;
            navigator.clipboard.writeText(formattedText);
            showToast();
            
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<div class="flex items-center gap-1 text-xs font-black"><i class="fa-solid fa-check"></i> KOPIERT!</div>`;
            btn.classList.replace('chrome-button', 'bg-zinc-300');

            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('bg-zinc-300', 'chrome-button');
            }, 1800);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2800);
        }

        function filterAndRender() {
            const query = searchInput.value.toLowerCase().trim();

            let filtered = products.filter(p => {
                const matchesCat = currentCategory === 'alle' || p.category === currentCategory;
                const matchesBrand = currentBrand === 'alle' || p.brand === currentBrand;
                const matchesSearch = p.name.toLowerCase().includes(query) || p.brand.toLowerCase().includes(query);
                const matchesAI = aiFilterQuery === '' || p.name.toLowerCase().includes(aiFilterQuery) || p.brand.toLowerCase().includes(aiFilterQuery) || p.category.toLowerCase().includes(aiFilterQuery);
                return matchesCat && matchesBrand && matchesSearch && matchesAI;
            });

            if (currentSort === 'az') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            } else if (currentSort === 'za') {
                filtered.sort((a, b) => b.name.localeCompare(a.name));
            } else if (currentSort === 'brand') {
                filtered.sort((a, b) => a.brand.localeCompare(b.brand));
            }

            renderProducts(filtered);
            updateCounts();
        }

        function triggerImageUpload() {
            document.getElementById('aiImageInput').click();
        }

        function handleAIImageScan(event) {
            const file = event.target.files[0];
            if (!file) return;

            const filename = file.name.toLowerCase();
            let detected = '';

            if (filename.includes('nike') || filename.includes('miler') || filename.includes('tech')) detected = 'nike';
            else if (filename.includes('moncler')) detected = 'moncler';
            else if (filename.includes('goose') || filename.includes('canada')) detected = 'canada goose';
            else if (filename.includes('stone')) detected = 'stone island';
            else if (filename.includes('schuh') || filename.includes('sneaker') || filename.includes('asics') || filename.includes('prada')) detected = 'schuhe';
            else detected = 'jacken';

            aiFilterQuery = detected;
            document.getElementById('aiStatus').classList.remove('hidden');
            document.getElementById('aiStatusDesc').innerText = `KI hat "${file.name}" analysiert. Gefiltert nach: "${detected.toUpperCase()}"`;
            filterAndRender();
        }

        function resetAISearch() {
            aiFilterQuery = '';
            document.getElementById('aiStatus').classList.add('hidden');
            document.getElementById('aiImageInput').value = '';
            filterAndRender();
        }

        document.querySelectorAll('.filter-cat').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-cat').forEach(b => {
                    b.className = 'filter-cat px-4 py-2 bg-zinc-900/60 border border-zinc-800/80 hover:border-zinc-600 text-zinc-400 rounded-xl text-xs font-semibold uppercase tracking-wider whitespace-nowrap transition';
                });

                const target = e.currentTarget;
                target.className = 'filter-cat px-4 py-2 chrome-button rounded-xl text-xs font-bold uppercase tracking-wider whitespace-nowrap transition active shadow-md';
                currentCategory = target.dataset.category;
                filterAndRender();
            });
        });

        searchInput.addEventListener('input', filterAndRender);
        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            filterAndRender();
        });

        function openModal() { document.getElementById('productModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('productModal').classList.add('hidden'); }

        document.getElementById('addProductForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newProd = {
                id: Date.now(),
                name: document.getElementById('inputName').value,
                brand: document.getElementById('inputBrand').value,
                category: document.getElementById('inputCategory').value,
                image: document.getElementById('inputImage').value,
                link: document.getElementById('inputLink').value
            };
            products.unshift(newProd);
            populateBrandFilter();
            filterAndRender();
            closeModal();
            showToast();
            e.target.reset();
        });

        populateBrandFilter();
        filterAndRender();
    </script>
